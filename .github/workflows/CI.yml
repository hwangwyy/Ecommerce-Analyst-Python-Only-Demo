name: CI.yml
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: check-out-repository
        uses: actions/checkout@v4
      - name: set-up-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: install-dependencies
        run: pip install -r requirements.txt
      - name: test
        uses: streamlit/streamlit-app-action@v0.0.3
        with:
          app-path: main.py
